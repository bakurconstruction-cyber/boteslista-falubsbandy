[build]
  publish = "public"
  command = "npm ci --omit=dev"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg", "@netlify/database"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
